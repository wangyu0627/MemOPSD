# Overwriting configs
train_batch_size: 256
eval_batch_size: 256
lr: 1e-3
weight_decay: 0.0
warmup_steps: 0

# Config for S3Rec
max_item_seq_len: 50
hidden_size: 64
num_hidden_layers: 2
num_attention_heads: 2
hidden_act: gelu
hidden_dropout_prob: 0.5
attention_probs_dropout_prob: 0.5
initializer_range: 0.02
layer_norm_epsilon: 1e-12

# S3Rec self-supervised pretraining.
# Set pretrain_epochs > 0 to run the original AAP/MIP/MAP/SP stage before fine-tuning.
pretrain_epochs: 0
mask_p: 0.2
aap_weight: 0.2
mip_weight: 1.0
map_weight: 1.0
sp_weight: 0.5

# Attribute extraction from the current dataset metadata.
attribute_min_freq: 2
attribute_vocab_size: 2048
max_attributes_per_item: 16

